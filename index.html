ّؤٍ وَشَئًا جَمِيـ ـعَ الْعَالَمِينَ صُعُودُهُ وَنُزُولُ", "أَدْنَاهُ حُبّاً رَبُّهُ وَحَبِيبُهُ فَأَتَاهُ مِنْهُ الْفَضْلُ وَالتَّكْمِيلُ", "لَمَّا انْتَهَى جِبْرِيلُ جَاوَزَ لِلَّذِي مَا فِيهِ لِلْمَخْلُوقِ قَطُّ حُلُولُ", "فَرَأَى عِيَاناً رَبَّهُ وَفُؤَادُهُ وَاعٍ وَلَيْسَ الطَّرْفُ مِنْهُ يَمِيلُ", "أَعْيَتْ صِفَاتُكَ يَا صَفِيَّ الْأَصْفِيَا كُلَّ الْعُقُولِ نَعَمْ وَحَارَ فُحُولُ", "أَنْتَ الَّذِي عَرَفَ الْإِلَهَ وَغَيْرُهُ مِقْدَارُكَ الْعَالِي لَهُ مَجْهُولُ", "فِي وَجْهِ آدَمَ نُورُ ذَاتِكَ قَدْ بَدَا فَلَهُ السُّجُودُ يَحِقُّ وَالتَّبْجِيلُ", "وَبَدَتْ لَوَائِحُ عِزِّكَ السَّامِي بِمَوْ لِدِكَ الْكَرِيمِ لِمَنْ لَهُ مَعْقُولُ", "لَا زَالَ تَقْطَعُ مُعْجِزَاتُكَ سَيِّدِي لِلْعَالَمِينَ وَمَا لَهُنَّ أُفُولُ", "شَمِلَتْ رِسَالَتُكَ الْأَنَامَ وَلَمْ يَكُنْ لِلْأَنْبِيَا وَالْمُرْسَلِينَ شُمُولُ", "مَا أَنْتَ إِلَّا رَحْمَةٌ يَا مُصْطَفَى فِي كُلِّ طَوْرٍ مِنْكَ أَنْتَ نَبِيلُ", "وَلَكَ الزَّمَانُ جَمِيعُهُ وَلَكَ الثَّنَا وَالْحَالُ وَالْإِمْدَادُ ثُمَّ الْقِيلُ", "مَاذَا يَقُولُ الْمَادِحُونَ وَرَبُّنَا يُثْنِي عَلَيْكَ وَإِنَّهُ لَجَلِيلُ", "صَلَّى عَلَيْكَ بِذَاتِهِ وَلِخَلْقِهِ أَمَرَ الصَّلَاةَ عَلَيْكَ يَا مَوْصُولُ", "كَمْ أَلْسُنٍ خُلِقَتْ لِمَدْحِكَ جَمَّةٍ وَشِعَارُهَا ذِكْرَاكَ وَالتَّبْجِيلُ", "كَمْ مَنْ بِذَيْلِكَ فِي الْوُجُودِ تَعَلَّقُوا وَبِكَ الْحَيَاةُ لَهُمْ وَأَنْتَ دَلِيلُ", "يَا سَيِّدِي يَا مُنْتَهَى عَمَلِ الَّذِي ظَمِئَتْ إِلَيْهِ نُفُوسُنَا وَعُقُولُ", "يَا غَوْثَنَا يَا نُورَنَا يَا مَنْ بِهِ عُرِفَ الْإِلَهُ وَأُنْزِلَ التَّنْزِيلُ", "يَا قِبْلَةَ الْأَرْوَاحِ يَا مَنْ ظِلُّهُ ضَافٍ عَلَى كُلِّ الْوَرَى مَسْدُولُ", "يَا عُمْدَتِي يَا كَعْبَتِي يَا مَنْ لَدَى مَثْوَاهُ أَرْوَاحُ الْكِرَامِ تَجُولُ", "هَذَا الْغَرِيبُ وَأَنْتَ يَا خَيْرَ الْوَرَى مَأْوَى الْوُفُودِ الْمُزْمِلِينَ رَسُولُ", "هَذَا الطَّرِيدُ وَمَا لِبَابِكَ قَدْ أَتَى غَلْقٌ وَأَنْتَ الْمَائِنُ الْمَأْمُولُ", "هَذَا الضَّبِيءُ أَتَى لِبَابِكَ ضَارِعاً وَمُرَادُهُ يَا ذَا الْجَمَالِ قَبُولُ", "لِي مِنْ صَمِيمِ الْقَلْبِ فِيكَ مَوَدَّةٌ يَا حَبَّذَا يَا حَبَّذَا الْ  {"id": "p1", "aud": true, "audio": "sahi-imtati.mp3", "cat": "parab", "lang": "ar", "title": "Sahi imtati al-hazma", "ar": "صاحِ امْتَطِ الحَزْمَ", "au": "الشيخ الحاج محمد الحبيب التجاني فاس", "bsm": "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ", "salat": "والصلاة والسلام على سيدنا رسول الله محمد وعلى آله وصحبه وسلم", "intro": "وبعدُ فهذه قصيدةٌ للشيخ الحاج محمد الحبيب بن الشيخ الحاج أحمد التجاني فاس، يمدح بها رسول الله صلى الله عليه وسلم متوسلا به إلى مولاه وخالقه عز وجل. ابتدأ كتابتها في لحظات الوداع الأخيرة النضّاحة بالمشاعر والحنين، حيث ودَّع أهله وخرج من بيته ليركب السيارة قاصداً التوجه إلى بلاد الحرمين الشريفين. ثم ما زالت القصيدة ترافقه وتؤنسه على مدى هذه الرحلة المباركة حتى انتهى من كتابة السطور الأخيرة منها في الحرم النبوي الشريف يوم السبت، ٨ نيسان ٢٠٢٣، الموافق لـ ١٧ رمضان ١٤٤٤.", "introFr": "Cette qasida est du Cheikh El Hadj Mohamed El Habib, fils du Cheikh El Hadj Ahmed Tijani Fass. Il y loue le Messager d'Allah ﷺ et s'en sert comme intermédiaire auprès de son Seigneur. Il a commencé à l'écrire au moment des adieux, lorsqu'il a quitté sa famille et sa maison pour partir vers les Deux Villes Saintes. Elle l'a accompagné tout au long de ce voyage béni, et il en a écrit les dernières lignes dans la Mosquée du Prophète ﷺ, le samedi 8 avril 2023, correspondant au 17 Ramadan 1444.", "introEn": "This qasida is by Sheikh El Hadj Mohamed El Habib, son of Sheikh El Hadj Ahmed Tijani Fass. In it he praises the Messenger of Allah ﷺ and turns through him to his Lord. He began writing it at the moment of farewell, as he left his family and home for the Two Holy Cities. It accompanied him throughout this blessed journey, and he wrote its last lines in the Prophet's Mosque ﷺ on Saturday 8 April 2023, corresponding to 17 Ramadan 1444.", "notes": {"1": "ويعني بها فاس غناس، مسقط رأسه ومنطلق سفره."}, "end": "اللهم صل على سيدنا محمد وسلم", "bayts": [["صاحِ امْتَطِ الحزمَ لا تلوي على أحدِ", "واعمَدْ لأحمدَ ساقي السِّرِّ ذي المدَدِ"], ["واختر نجيبةَ عصر التكنولوجي تجي", "من الإمارات e a day.", "ff": "Wazifa woni farilla e Tijaaniijo. Ngaɗetee marde gooto ñalnde kala, subaka malla kikiiɗe; hoore silsila maaɗa, ɗum waawi ngaɗeede marde ɗiɗi.", "wo": "Wasifa mooy benn ci warugar yi Tijaan bi war. Ñu koy def benn yoon ci bés bu nekk, suba walla ngoon. Su ñu ko defee ci sanad bi ñu ko jëlee, mën na nekk ñaari yoon ci bés bi."}, "wazNB": {"ar": "تنبيه: من أخذ الورد عن طريق القطب الشيخ سيدي الحاج مالك سي فعليه أن يؤدي الوظيفة مرتين وجوبًا.", "fr": "À noter : celui qui prend le wird selon la chaîne initiatique du grand Pôle Cheikh Seydil Hadj Malick Sy doit impérativement faire la wazifa 2 fois.", "en": "Note: whoever takes the wird through the chain of the great Pole Cheikh Seydil Hadj Malick Sy must perform the wazifa twice.", "ff": "Ɗum ko nde: ko lomtii wird e silsila Seydil Hadj Malick Sy, haani mo ngaɗa wazifa marde ɗiɗi.", "wo": "Bu ñu la jox wird bi ci sanad bu Sëriñ Sidi Haaji Maalig Si, war nga def wasifa bi ñaari yoon."}, "hadI": {"ar": "على التجاني أن يقرأ يوم الجمعة، زيادة على ما سبق من لوازمه، الأذكار الآتية:", "fr": "Le musulman tidjane doit réciter le vendredi, en plus de ses obligations précédentes, les litanies suivantes :", "en": "On Fridays, in addition to the obligations above, the Tijani Muslim must recite the following litanies:", "ff": "Juulɗo Tijaaniijo haani tokkitaago Jumaa, ɓaawo farillaaji ɗi ɓaawo, jikruuji ɗii:", "wo": "Jullit Tijaan bi war na jàng, ci Àjjuma, ak li nu wax ci kaw, dikr yii:"}, "hadNB": {"ar": "تنبيه: ينبغي أن ينتهي هذا الذكر مع دخول وقت صلاة المغرب.", "fr": "À noter : la fin de cette séance de zikr doit coïncider avec le début de la prière du Maghrib.", "en": "Note: the end of this zikr session must coincide with the start of the Maghrib prayer.", "ff": "Ɗum ko nde: gaɗal jikru nguu haani timmina e fuɗɗoode juulde Maghrib.", "wo": "Xaar na tëj dikr bi ci ni julli tisbaar di tàmbalee."}, "nb": {"ar": "تنبيه", "fr": "À noter", "en": "Note", "ff": "Ɗum ko nde", "wo": "Xamal"}, "tr": {"ar": "النطق", "fr": "Tr /* ===== Animations : apparition 3D, inclinaison au survol, parallax ===== */
(function(){
 var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,root=document.documentElement,hero=document.querySelector('.hero');
 if(!RM&&'IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -6% 0px',threshold:.06});
  var SEL='.tile,.book,.bayt,.ws,.card,.wg,#groups .gh,.author,.pay,.qk,.prof,.pm-head,.text>.l',pend=false;
  function scan(){pend=false;var n=0;document.querySelectorAll('.wrap '+SEL.split(',').join(',.wrap ')).forEach(function(e){if(e.dataset.rv)return;e.dataset.rv=1;
   var r=e.getBoundingClientRect(),vis=r.top<innerHeight&&r.bottom>0;e.style.setProperty('--d',(vis?Math.min(n++,10)*.05:0)+'s');e.classList.add('rv');io.observe(e)})}
  new MutationObserver(function(){if(!pend){pend=true;requestAnimationFrame(scan)}}).observe($('main'),{childList:true,subtree:true});scan()}
 if(!RM&&hero&&'IntersectionObserver' in window)new IntersectionObserver(function(es){hero.classList.toggle('off',!es[0].isIntersecting)}).observe(hero);
 var tick=false;
 function frame(){tick=false;var y=window.scrollY||0;
  if(!RM){root.style.setProperty('--bgy',(-(y*.15)%80).toFixed(1)+'px');if(view==='home'&&y<900)hero.style.setProperty('--p',Math.round(y))}
  var long=view==='reader'||view==='pg',h=document.documentElement.scrollHeight-innerHeight;
  root.style.setProperty('--sp',long&&h>40?Math.min(1,y/h).toFixed(3):0)}
 addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(frame)}},{passive:true});addEventListener('resize',frame,{passive:true});
 if(RM||!(window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches))return;
 var tgt=null,ev=null,raf=0;
 function tilt(){raf=0;if(!tgt||!ev)return;var r=tgt.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height,big=tgt.classList.contains('tile')?10:3;
  tgt.style.setProperty('--ry',((x-.5)*big).toFixed(2)+'deg');tgt.style.setProperty('--rx',((.5-y)*big).toFixed(2)+'deg');tgt.style.setProperty('--mx',(x*100).toFixed(1)+'%');tgt.style.setProperty('--my',(y*100).toFixed(1)+'%')}
 function reset(e){if(!e)return;['--rx','--ry'].forEach(function(k){e.style.removeProperty(k)})}
 document.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest('.tile,.book');if(t!==tgt){reset(tgt);tgt=t}ev=e;
  if(tgt&&!raf)raf=requestAnimationFrame(tilt);
  if(hero&&view==='home'){var hr=hero.getBoundingClientRect();if(e.clientY<hr.bottom){hero.style.setProperty('--hy',((e.clientX/innerWidth-.5)*16).toFixed(1)+'deg');hero.style.setProperty('--hx',((.5-(e.clientY-hr.top)/hr.height)*12).toFixed(1)+'deg')}}},{passive:true});
 document.addEventListener('pointerleave',function(){reset(tgt);tgt=null},{passive:true});
})();

var PGC={};
function pageUrl(n){return 'm/p/'+('00'+(n+1)).slice(-3)+'.webp'}
function pageSrc(n,cb){var u=pageUrl(n);
 if(PGC[u])return cb(u);

<script>
var SWR=null;
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').then(function(r){SWR=r}).catch(function(){})}catch(e){}})}
// Mises à jour : quand l'appli revient au premier plan, on vérifie si le site a changé.
// Si oui, on recharge tout de suite (écran d'accueil) ou on propose « Mettre à jour ».
(function(){
 if(!/^https?:/.test(location.protocol)||!window.fetch)return;
 var tag=null,last=0,busy=false;
 function stamp(){return fetch('./index.html',{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok?(r.headers.get('etag')||r.headers.get('last-modified')||''):''}).catch(function(){return ''})}
 function bar(){if($('upd'))return;var b=document.createElement('button');b.id='upd';
  b.textContent='✨ '+T('Nouveautés disponibles · Mettre à jour','New content available · Update','محتوى جديد · تحديث');
  b.onclick=function(){location.reload()};document.body.appendChild(b)}
 function check(){if(busy||Date.now()-last<30000)return;busy=true;last=Date.now();if(SWR)try{SWR.update()}catch(e){}
  stamp().then(function(s){busy=false;if(!s)return;if(tag===null){tag=s;return}
   if(s!==tag){if(view==='home')location.reload();else bar()}})}
 stamp().then(function(s){tag=s||null;last=Date.now()});
 document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check()});
 window.addEventListener('focus',check);window.addEventListener('online',function(){last=0;check()});
 setInterval(function(){if(document.visibilityState==='visible')check()},15*60*1000);
})();
</script>
