 {"id": "p1", "aud": true, "audio": "sahi-imtati.mp3", "cat": "parab", "lang": "ar", "title": "Sahi imtati al-hazma", "ar": "صاحِ امْتَطِ الحَزْمَ", "au": "الشيخ الحاج محمد الحبيب التجاني فاس", "bsm": "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ", "salat": "والصلاة والسلام على سيدنا رسول الله محمد وعلى آله وصحبه وسلم", "intro": "وبعدُ فهذه قصيدةٌ للشيخ الحاج محمد الحبيب بن الشيخ الحاج أحمد التجاني فاس، يمدح بها رسول الله صلى الله عليه وسلم متوسلا به إلى مولاه وخالقه عز وجل. ابتدأ كتابتها في لحظات الوداع الأخيرة النضّاحة بالمشاعر والحنين، حيث ودَّع أهله وخرج من بيته ليركب السيارة قاصداً التوجه إلى بلاد الحرمين الشريفين. ثم ما زالت القصيدة ترافقه وتؤنسه على مدى هذه الرحلة المباركة حتى انتهى من كتابة السطور الأخيرة منها في الحرم النبوي الشريف يوم السبت، ٨ نيسان ٢٠٢٣، الموافق لـ ١٧ رمضان ١٤٤٤.", "introFr": "Cette qasida est du Cheikh El Hadj Mohamed El Habib, fils du Cheikh El Hadj Ahmed Tijani Fass. Il y loue le Messager d'Allah ﷺ et s'en sert comme intermédiaire auprès de son Seigneur. Il a commencé à l'écrire au moment des adieux, lorsqu'il a quitté sa famille et sa maison pour partir vers les Deux Villes Saintes. Elle l'a accompagné tout au long de ce voyage béni, et il en a écrit les dernières lignes dans la Mosquée du Prophète ﷺ, le samedi 8 avril 2023, correspondant au 17 Ramadan 1444.", "introEn": "This qasida is by Sheikh El Hadj Mohamed El Habib, son of Sheikh El Hadj Ahmed Tijani Fass. In it he praises the Messenger of Allah ﷺ and turns through him to his Lord. He began writing it at the moment of farewell, as he left his family and home for the Two Holy Cities. It accompanied him throughout this blessed journey, and he wrote its last lines in the Prophet's Mosque ﷺ on Saturday 8 April 2023, corresponding to 17 Ramadan 1444.", "notes": {"1": "ويعني بها فاس غناس، مسقط رأسه ومنطلق سفره."}, "end": "اللهم صل على سيدنا محمد وسلم", "bayts": [["صاحِ امْتَطِ الحزمَ لا تلوي على أحدِ", "واعمَدْ لأحمدَ ساقي السِّرِّ ذي المدَدِ"], ["واختر نجيبةَ عصر التكنولوجي تجي", "من الإمارات function sbFetch(path,o){o=o||{};var h=Object.assign({'apikey':SB.key,'Content-Type':'application/json'},o.headers||{});
 return fetch(SB.url+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}).then(function(r){
  return r.text().then(function(x){var j=null;try{j=x?JSON.parse(x):null}catch(e){}if(!r.ok){var er=new Error((j&&(j.msg||j.error_description||j.message||j.error))||('HTTP '+r.status));er.code=(j&&(j.error_code||j.code))||r.status;throw er}return j})})}
function keepSession(j){if(!j||!j.access_token)return null;var u=j.user||{},md=u.user_metadata||{},em=u.email||'';
 AUTH.s={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),
  user:{id:u.id,email:/@users\.defteram\.app$/.test(em)?'':em,name:md.username||(em.split('@')[0])}};
 save('defteram_auth',AUTH.s);return AUTH.s}
function token(){var s=AUTH.s;if(!s)return Promise.reject(new Error('no session'));
 if(s.exp-60>Date.now()/1000)return Promise.resolve(s.at);
 if(!AUTH.busy)AUTH.busy=sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.rt}})
  .then(function(j){AUTH.busy=null;if(!keepSession(j))throw new Error('refresh');return AUTH.s.at})
  .catch(function(e){AUTH.busy=null;if(e.code===400||e.code===401||e.code==='refresh_token_not_found'||e.code==='session_not_found'){logoutLocal()}throw e});
 return AUTH.busy}
function authErr(e){var c=String(e.code||''),m=String(e.message||'');
 if(c==='invalid_credentials'||/invalid login/i.test(m))return T('Identifiant ou mot de passe incorrect.','Wrong username or password.','اسم المستخدم أو كلمة المرور غير صحيحة.');
 if(c==='user_already_exists'||/already registered/i.test(m))return T('Ce nom est déjà pris. Choisis-en un autre ou connecte-toi.','This name is already taken. Pick another or sign in.','هذا الاسم مستخدم. اختر غيره أو سجّل الدخول.');
 if(c==='weak_password'||/password/i.test(m)&&/least|weak|short/i.test(m))return T('Mot de passe trop faible : au moins 6 caractères.','Password too weak: at least 6 characters.','كلمة المرور ضعيفة: 6 أحرف على الأقل.');
 if(c==='email_not_confirmed')return T('La confirmation par e-mail est encore activée sur le serveur.','Email confirmation is still enabled on the server.','تأكيد البريد ما زال مفعلا على الخادم.');
 if(c==='over_request_rate_limit'||c==='429')return T('Trop d’essais. Réessaie dans une minute.','Too many attempts. Try again in a minute.','محاولات كثيرة. أعد المحاولة بعد دقيقة.');
 if(e instanceof TypeError)return T('Pas de connexion Internet.','No internet connection.','لا يوجد اتصال بالإنترنت.');
 return T('Erreur : ','Error: ','خطأ: ')+m}
function signIn(id,pw){return sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email:idToEmail(id),password:pw}}).then(keepSession)}
function signUp(id,pw){var name=id.indexOf('@')>-1?id.split('@')[0]:id;
 return sbFetch('/auth/v1/signup',{method:'POST',body:{email:idToEmail(id),password:pw,data:{username:name}}}).then(function(j){
  if(j&&j.access_token)return keepSession(j);
  if(j&&j.session&&j.session.access_token)return keepSession(Object.assign({user:j.user},j.session));
  return signIn(id,pw)})}

/* ===== Animations : apparition 3D, inclinaison au survol, parallax ===== */
(function(){
 var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,root=document.documentElement,hero=document.querySelector('.hero');
 if(!RM&&'IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -6% 0px',threshold:.06});
  var SEL='.tile,.book,.bayt,.ws,.card,.wg,#groups .gh,.author,.pay,.qk,.prof,.pm-head,.text>.l',pend=false;
  function scan(){pend=false;var n=0;document.querySelectorAll('.wrap '+SEL.split(',').join(',.wrap ')).forEach(function(e){if(e.dataset.rv)return;e.dataset.rv=1;
   var r=e.getBoundingClientRect(),vis=r.top<innerHeight&&r.bottom>0;e.style.setProperty('--d',(vis?Math.min(n++,10)*.05:0)+'s');e.classList.add('rv');io.observe(e)})}
  new MutationObserver(function(){if(!pend){pend=true;requestAnimationFrame(scan)}}).observe($('main'),{childList:true,subtree:true});scan()}
 if(!RM&&hero&&'IntersectionObserver' in window)new IntersectionObserver(function(es){hero.classList.toggle('off',!es[0].isIntersecting)}).observe(hero);
 var tick=false;
 function frame(){tick=false;var y=window.scrollY||0;
  if(!RM){root.style.setProperty('--bgy',(-(y*.15)%80).toFixed(1)+'px');if(view==='home')hero.style.setProperty('--p',Math.round(Math.min(y,900)))}
  var long=view==='reader'||view==='pg',h=document.documentElement.scrollHeight-innerHeight;
  root.style.setProperty('--sp',long&&h>40?Math.min(1,y/h).toFixed(3):0)}
 addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(frame)}},{passive:true});addEventListener('resize',frame,{passive:true});
 if(RM||!(window.matchMedia&&matchMedia('(hover: hover) and (pointer: fine)').matches))return;
 var tgt=null,ev=null,raf=0;
 function tilt(){raf=0;if(!tgt||!ev)return;var r=tgt.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height,big=tgt.classList.contains('tile')?10:3;
  tgt.style.setProperty('--ry',((x-.5)*big).toFixed(2)+'deg');tgt.style.setProperty('--rx',((.5-y)*big).toFixed(2)+'deg');tgt.style.setProperty('--mx',(x*100).toFixed(1)+'%');tgt.style.setProperty('--my',(y*100).toFixed(1)+'%')}
 function reset(e){if(!e)return;['--rx','--ry'].forEach(function(k){e.style.removeProperty(k)})}
 document.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest('.tile,.book');if(t!==tgt){reset(tgt);tgt=t}ev=e;
  if(tgt&&!raf)raf=requestAnimationFrame(tilt);
  if(hero&&view==='home'){var hr=hero.getBoundingClientRect();if(e.clientY<hr.bottom){hero.style.setProperty('--hy',((e.clientX/innerWidth-.5)*16).toFixed(1)+'deg');hero.style.setProperty('--hx',((.5-(e.clientY-hr.top)/hr.height)*12).toFixed(1)+'deg')}}},{passive:true});
 document.addEventListener('pointerleave',function(){reset(tgt);tgt=null},{passive:true});
})();

/* ===== Compteurs : visiteurs, visites, partages (fonction /api/stats sur Vercel) ===== */
var STATS=null;
function fmtN(n){try{return Number(n).toLocaleString(lang==='ar'?'ar':lang==='en'?'en-US':'fr-FR')}catch(e){return String(n)}}
function stat(e){if(!/^https?:/.test(location.protocol)||!window.fetch)return Promise.resolve(null);
 return fetch('api/stats'+(e?'?e='+e:''),{method:e?'POST':'GET',cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})
  .then(function(j){if(j&&typeof j.visitors==='number'){STATS=j;showStats()}return j})}
function statsHtml(big){if(!STATS)return '';var x=[['👥',STATS.visitors,T('visiteurs','visitors','زائر')],['👁️',STATS.visits,T('visites','visits','زيارة')],['📤',STATS.shares,T('partages','shares','مشاركة')]];
 return x.map(function(i){return '<div class="st"><i aria-hidden="true">'+i[0]+'</i><b>'+fmtN(i[1])+'</b><small>'+i[2]+'</small></div>'}).join('')}
function showStats(){var h=$('hstats');if(h){h.innerHTML=statsHtml();h.classList.toggle('hide',!STATS)}var a=$('astats');if(a){a.innerHTML=statsHtml();a.parentNode.classList.toggle('hide',!STATS)}}

 setTimeout(function(){stat(ev).then(function(j){if(j){try{if(first)localStorage.setItem('defteram_vid','1');sessionStorage.setItem('defteram_seen','1')}catch(e){}}})},first?600:1500)})();

var PGC={};
function pageUrl(n){return 'm/p/'+('00'+(n+1)).slice(-3)+'.webp'}
function pageSrc(n,cb){var u=pageUrl(n);
 if(PGC[u])return cb(u);
 var im=new Image();im.decoding='async';
 im.onload=function(){PGC[u]=1;cb(u)};
 im.onerror=function(){toast(T('Chargement impossible. Vérifiez la connexion.','Could not load. Check your connection.','تعذر التحميل. تحقق من الاتصال.'))};

<script>
var SWR=null;
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').then(function(r){SWR=r}).catch(function(){})}catch(e){}})}
// Mises à jour : quand l'appli revient au premier plan, on vérifie si le site a changé.
// Si oui, on recharge tout de suite (écran d'accueil) ou on propose « Mettre à jour ».
(function(){
 if(!/^https?:/.test(location.protocol)||!window.fetch)return;
 var tag=null,last=0,busy=false;
 function stamp(){return fetch('./index.html',{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok?(r.headers.get('etag')||r.headers.get('last-modified')||''):''}).catch(function(){return ''})}
 function bar(){if($('upd'))return;var b=document.createElement('button');b.id='upd';
  b.textContent='✨ '+T('Nouveautés disponibles · Mettre à jour','New content available · Update','محتوى جديد · تحديث');
  b.onclick=function(){location.reload()};document.body.appendChild(b)}
 function check(){if(busy||Date.now()-last<30000)return;busy=true;last=Date.now();if(SWR)try{SWR.update()}catch(e){}
  stamp().then(function(s){busy=false;if(!s)return;if(tag===null){tag=s;return}
   if(s!==tag){if(view==='home')location.reload();else bar()}})}
 stamp().then(function(s){tag=s||null;last=Date.now()});
 document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check()});
 window.addEventListener('focus',check);window.addEventListener('online',function(){last=0;check()});
 setInterval(function(){if(document.visibilityState==='visible')check()},15*60*1000);
})();
</script>
