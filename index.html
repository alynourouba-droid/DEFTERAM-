 ["إِنَّ الَّذِي كَانَ بَيْنَ الْمَنْكِبَيْنِ بَعِيدٌ إِنَّهُ كَانَ سَبْطَ الْعَصْبِ فَاسْتَقِمِ"], ["وَكَانِ سَائِلَ أَطْرَافٍ وَضَحْمَ كَرَا دِيسٍ جَلِيلَ مُشَاشٍ أَجْوَدَ النَّسَمِ"], ["عَبْلُ الذِّرَاعَيْنِ وَالْعَضْدَيْنِ شَبْحُهُمَا قُلْ جَوْهَرُ الْحُسْنِ فِيهِ غَيْرُ مُنْقَسِمِ"], ["وَمَنْ رَآهُ مُفَاجَاةً يَهَابُ بِهِ أَمَّا مُخَالِطُهُ فَالزَّائِدُ الرَّخَمِ"], ["وَبَادِنٌ فِي اعْتِدَالِ الْخَلْقِ مَخْبَرُهُ مَرْآهُ يَشْهَدُ مَا قَدْ حَازَ مِنْ كَرَمِ"], ["إِنْ قُلْتَ أَطْنَبْتَ فِي التَّوْصِيفِ قُلْتُ نَعَمْ كُلُّ الْمَقَامِ لَهُ حَقٌ فَلَا تَضِمِ"], ["وَوَاجِبٌ طَاعَةُ الْهَادِي مَحَبَّتُهُ كَذَا التِّبَاعُ الَّذِي يَأْتِي مِنَ الْأُمَمِ"], ["لَهَا الْعَلَامَاتُ قَالُوا إِنَّ أَعْظَمَهَا اسْتِعْمَالُ سُنَّتِهِ مِنْ جُمْلَةِ الْإِمَمِ"], ["وَلَيْسَ نَفْعٌ عَلَى حُبٍّ بِلَا عَمَلٍ وَتَابِعَنْ سُنَّةَ الْمُخْتَارِ تَغْتَنِمِ"], ["وَكَثْرَةُ الشَّوْقِ فِي لُقْيَا لِسَيِّدِنَا مِنَ الْعَلَامَاتِ هَبْ لِي ذَاكَ ذَا الْأُمَمِ"], ["وَكَثْرُ ذِكْرٍ صَلَاةٍ ثُمَّ نُصْرَةُ دِينِهِ تَخَلُّقُ مَا قَدْ جَاءَ مِنْ شِيَمِ"], ["تَعْظِيمُهُ وَالْتِذَاذٌ حِينَ تَذْكُرُهُ حُبُّ الْقُرَانِ وَأَصْحَابٍ لَهُ كَرَمِ"], ["إِنَّ الْقُرَانَ هُوَ الْمِيزَانُ تَعْرِفُ مِنْهُ مَا حَوَيْتَ مِنَ الْأَشْوَاقِ وَالسَّدَمِ"], ["يَا مَنْ يُرِيدُ جِنَانَ الْخُلْدِ يَسْكُنُهَا فَقَدِّمَنْ طَلَبَ الْمِفْتَاحِ تُحْتَرَمِ"], ["وَالْمُعْجِزَاتُ لَهُ تَعْدَادُهَا عَبَثٌ مِعْشَارُ الاَعْشَارِ لَمْ يُدْرَكْ وَلَمْ يُسَمِ"], ["جِيمُ الأُلُوفِ لِهَادِي الْخَلْقِ مُعْجِزَةً أَمَّا الْقُرَانُ فَقَالُوا فِيهِ عَدُّ لَمِ"], ["كَفَى الْقُرَانُ الَّذِي يَغْدُو بِهِ الْفُصَحَاءُ اللُّسْنُ فِي بَكَمٍ وَالْبَهْتِ وَالصَّمَمِ"], ["وَأُحْكِمَتْ فُصِّلَتْ آيَاتُهُ كَلِمَا تُهُ بِهِ حَارَتِ الْأَحْلَامُ لِلشُّهُمِ"], ["وَكَانَ خُلْقَ نَبِيِّ اللَهِ لَيْسَ لَهُ خُلْقٌ سِوَاهُ فَفَاقَ الْكُلَّ فِي الْكَرَمِ"], ["وُجُوهُ إِعْجَازِهِ أَعْيَتْ مُعَارِضَهُ وَأَمْرُ الاِعْجَازِفَاتُوجَا مِنَ الْحَكَمِ"], ["إِنَّ الْمَمَاتَ وَمَحْيَا الْبَدْرِ مَرْحَمَةٌ أَمَاتَنَا اللَهُ فِي هَدْيِ الرِّضَى الْكَرَمِ"], ["تُبَانُ أَعْمَالُنَا يَوْمَ الْخَمِيسِ لَهُ وَيَوْمَ الاِثْنَيْنِ فِي اسْتِغْفَارِ ذِي الْجُرَمِ"], ["لَهُ مِنَ الْمُعْجِزَاتِ الْغُرِّ جُمْلَةُ مَا لِلْأَنْبِيَا بِاخْتِصَاصِ الْفَضْلِ وَالْوَذَمِ"], ["تَسْلِيمُ الاَحْجَارِ وَالْأَشْجَارِ شَاهِدَةً مُنْقَادَةً كَانْقِيَادِ الشَّمْسِ وَالظَّلَمِ"], ["إِنَّ الْمُغَيِّبَ كَالْمَشْهُودِ يُخْبِرُهُ كَأَمْرِ عُثْمَانَ وَالْإِصْلَاحِ لِلْأُمَمِ"], ["كَذَا أَتَى شَجَرٌ لِلْبَرِّ يَسْتُرُهُ يَارَبِّ هَبْ لِي اسْتِتَارًا غَيْرَ مُنْفَصِمِ"], ["إِبْرَاءُ الاَسْقَامِ وَالْآلَامِ مُوجِعَةً إِحْيَاءُ الاَمْوَاتِ مَعْ إِبْرَاءِ ذِي الاَّمَمِ"], ["تَقْلِيبُ الَاعْيَانِ تَكْلِيمُ الْبَهَائِمِ تَكْثِيرُ الْقَلِيلِ شِفَاءُ الْأَكْمَهِ السَّدِمِ"], ["وَسَلْ مُعَاوِيَةَ بْنَ الثَّوْرِ دَعْوَتَهُ أَوِ الْحَلِيمَةَ وَالْأَمْثَالَ تَنْفَحِمِ"], ["تَأْمِينُ أُسْكُفَّةٍ تَسْبِيحُ أَطْعِمَةٍ شَكْوَى الْبَعِيرِ وَشَكْوَى الطَّيْرِ لِلْعَلَمِ"], ["مِنْهَا إِئْتِمَارُ غَمَامٍ مِنْ إِشَارَتِهِ فِي السَّقْيِ وَ الصَّحْوِ وَالْإِسْقَاطُ لِلصَّنَمِ"], ["مَا فَرَّ عَنْهُ وُحُوشٌ بَلْ تُوَالِفُهُ وَالْمِلْحُ عَذْبٌ فُرَاتٌ لَيْسَ بِالسُّدُمِ"], ["إِنَّ الْجَمَادَاتِ وَالْعَجْمَاءَ مُفْصِحَةٌ بِمَا بِهِ الْفُصَحَاءُ اللُّسْنِ فِي الْبَكَمِ"], ["وَيَشْهَدُ الضَّبُّ مَعْ ذِئْبٍ رِسَالَتَهُ كَظَبْيَةٍ فِي وَثَاقِ الْقَانِصِ الْعَرِمِ"], ["إِنَّ الْحَصَى سَبَّحَتْ فِي كَفِّهِ وَبِقَبْضَةٍ كَتَائِبُ فَرُّوا شَرَّ مُنْهَزَمِ"], ["وَهَكَذَا نَاقَةٌ أَدَّتْ شَهَادَتَهَا لِرَبِّهَا عِنْدَ هَادِي الْخَلْقِ لِلْحَكَمِ"], ["قَالَتْ وَقَدْ شَهِدَتْ مَا كَانَ سَارِقَهَا بِلْ إِنَّهَا مِلْكُهُ حَقًّا فَلَمْ تُلَمِ"], ["وَفَاحَ عُتْبَةُ رِيحًا مَسَّ رَاحَتِهِ يَضُوعُ مِنْهُ الشَّذَا وَالْمِسْكُ فِي الشَّمَمِ"], ["وَحَنَّ جِذْعٌ حَنِينَ الثُّكْلِ ذَا وَلَهٍ وَسَاجِدٌ جَمَلٌ لِلْبَدْرِ كَالْغَنَمِ"], ["لَوْلَمْ يَنَلْ ضَمَّ هَادِينَا لَدَامَ لَهُ حَنِينُهُ دَائِمًا لِلْبَعْثِ وَالْقُحَمِ"], ["تَجَلَّبَتْ شُوَّلٌ وَالشَّاةُ مُخْبِرَةٌ سُمًّا وَلَمْ يَلْقَ إِذْ سَمَّى مِنَ الْأَلَمِ"], ["ذُو النُّورِ فِي سَوْطِهِ يَبْدُو لَهُمْ عَجَبٌ أَعْنِي طُفَيْلَ بْنَ عَمْرٍ وَ بِالنَّبِي اعْتَصِمِ"], ["وَإِنَّ فِي الْبَدْرِ أَهْلَ النَّدْوَةِ اصْطَلَمُوا مَنْ مَسَّهُ التُّرْبُ مِنْهُمْ غَيْرُ ذِي سَلَمِ"], ["قَبْلَ اللِّقَا بَيَّنَ الْهَادِي مَصَارِعَهُمْ حَدِّثْهُ عَنْ عُمَرَ الْفَارُوقِ ذِي الْحُرَمِ"], ["لِلَهِ يَوْمٌ بِهِ الْإِسْلَامُ مُشْتَهِرٌ وَعَمُّهُ كَانَ فِي الْإِنْفَاقِ ذَا سَدَمِ"], ["وَمَا دَعَا قَطُّ إِلَّا كَانَ دَعْوَتُهُ مُجَابَةً دُونَ تَرْدِيدٍ وَلَا عَتَمِ"], ["وَمَاءُ يَبْسَانَ إِذْ سَمَّى النَّبِيُّ بِهِ نَعْمَانَ عَذْبٌ فُرَاتٌ طَيِّبُ الطُّعَمِ"], ["مَصُّ اللِّسَانِ بِهِ الْعَطْشَانُ نَالَ رِوًى وَانْزَاحَ بَرْدٌ وَحَرٌّ عَنْ عَلِيِّهِمِ"], ["وَإِنَّمَا رُضَعَاءُ الْبَدْرِ فَاطِمَةٍ بِتَفْلَةٍ لَهُمُ اسْتَغْنَوا عَنِ الْغُذَمِ"], ["وَذَاكَ فِي يَوْمِ عَاشُورَاءَ يَا لَهُمُ بِتَفْلَةٍ خَلَّةً سَدَّتْ بِيَوْمِهِمِ"], ["وَمِنْ أَنَامِلِهِ نَبْعُ الْمِيَاهِ وَقُلْ فِي كَفِّهِ شَبِعَ الْآلَافُ مِنْ طُعَمِ"], ["رُكُوبُ فَحْلٍ عَرُوضٍ قَاطِعٍ طُرُقًا مِنْ مُعْجِزَاتِ نَبِيٍّ خِيرَةِ الْأُمَمِ"], ["أَعْطَى قَتَادَةَ عُرْجُونًا يُضِيئُ لَهُ فِي بَيْتِهِ ضَارِبَ الشَّيْطَانِ ذَا هَزَمِ"], ["وَفِي ابْنِ بِشْرٍ أُسَيْدِ بْنِ الْحُضَيْرِ مُصَغْغِرَيْنِ أَمْرٌ عَجِيبٌ خَارِقُ الدِّجَمِ"], ["وَسَلْ رُكَانَةَ إِذْ مَا كَانَ صَارَعَهُ بَلْ سَلْ أَبَا الْأَسْوَدِ الْجُمْحِيَّ تَسْتَلِمِ"], ["أَوْ كَيْفَ كَانَ وَرَبِّي اللَهُ فِي أُحُدٍ شُجَاعَةُ الْمُصْطَفَى لِلْجَيْشِ ذَا شَمَمِ"], ["أَوْ سَلْ أُبَيًّا إِذَا لَاقَاهُ مُعْتَلِقًا عَلَيْهِ بُرْثُنُ لَيْثٍ ضَيْغَمٍ حُطَمِ"], ["أَبُو هُرَيْرَةَ سَائِلْ مِنْهُ قَبْضَتَهُ مِنْهَا قَدَ انْفَقَ أَحْقَابًا مِنَ الْهَنَمِ"], ["لِلَهِ شَطْرٌ عَلَى رِفٍّ لِعَائِشَةٍ بِهِ انْتَفَى رِيحُ أَفْوَاهٍ مِنَ اللَّحَمِ"], ["لَهُ يُسَبِّحُ رُمَّانٌ كَذَا عِنَبٌ أَتَى بِهِ الرُّوحُ لِاْمَبْعُوثِ فِي سَقَمِ"], ["عُكَاشَةٌ جَذْلُهُ صَارَ الْحُسَامَ طَوِيلَ قَامَةٍ يُدَّعَى عَوْنًا لِمُلْتَطِمِ"], ["وَلَمْ يَزَلْ فِي قِتَالِ الْكَافِرِينَ بِهِ حَتَّى يَكُونَ شَهِيدًا فِي قِتَالِهِمِ"], ["مِنْهُ ابْنُ جَحْشٍ حَوَى الْعُرْجُونَ فِي أُحُدٍ فَعَادَ سَيْفًا حَدِيدًا غَيْرَ مُكْتَهِمِ"], ["كَانَ التَّوَارُثُ أَوْ بَاعُوهُ فِي ذَهَبٍ مِنَ الْأَمِيرِ بُغَا التُّرْكِي لِمُعْتَصِمِ"], ["وَحَازَ مَا حَازَ لَكِنْ لَا يُمَاثِلُ مِنْ تَوَاضُعٍ وَخُشُوعِ الْقَلْبِ وَالرَّتَمِ"], ["مِنْ كُلِّ وَصْفٍ حَمِيدٍ حَازَ أَفْعَلَ تَفْضِيلٍ رَجَاءُ الْبَرَايَا يَوْمَ مُزْدَحَمِ"], ["وَكَانَ أَشْجَعَ أَسْخَى النَّاسِ أَحْسَنَهُمْ خَلْقًا وَخُلْقًا وَخَيْرَ الْحِزْبِ وَالْأُمَمِ"], ["مَا كَانَ تَحْتَاجُ تَبْيِينًا شَجَاعَتُهُ أَهْلَ الْمَدِينَةِ سَائِلْ لَيْلَ فَزْعِهِمِ"], ["كَانُوا إِذَا احْمَرَّ بَأْسٌ يَتَّقُونَ بِهِ وَقَدْ بَدَتْ فِي حُنَيْنٍ غَايَةُ الْقُدُمِ"], ["وَأَلْيَنُ النَّاسِ قَالُوا لَمْ يَكُنْ أَبَدًا بَيْنَ الصَّحَابَةِ ذَا مَدٍّ مِنَ الْقَدَمِ"], ["مُجِيبَ دَعْوَةِ مَمْلُوكٍ وَرَاكِبًا الْحِمَارَ عَائِدَ ذِي الْأَوْجَاعِ وَالسَّقَمِ"], ["وَمَا يُجِيبُ شَفِيعُ الْخَلْقِ دَاعِيَهُ إِلَّا بِلَبَّيْكَ فِي تَرْحِيبِهِ الْجَمَمِ"], ["إِمَّا عَبِيدٌ وَصِبْيَانٌ يُسَلِّمُهُمْ مُمَازِحٌ غَيْرُ حَقٍّ مَا إِلَيْهِ نُمِي"], ["مُلَازِمُ الْجُوعِ بِالْأَحْجَارِ مُنْتَصِرًا لَكِنَّ ذَلِكَ مَا قَدْ كَانَ مِنْ يَتَمِ"], ["إِنَّ الطَّعَامَيْنِ مَا فِي بَطْنِهِ اجْتَمَعَا وَلَمْ يَكُ قَطُّ شَبْعَانًا مِنَ الطُّعَمِ"], ["لَهُ ثَلَاثُونَ يَوْمًا مَا يَذُوقُ سِوَى مَا كَانَ إِبْطُ بِلَالٍ ضَمَّ مِنْ طُعَمِ"], ["يَمُرُّ شَهْرٌ أَوِ الشَّهْرَانِ مِنْ زَمَنٍ وَلَمْ تَرَ الْعَيْنَ فِي الْأَبْيَاتِ مِنْ حَدَمِ"], ["مَا كَانَ يَأْكُلُ خَيْرُ الْخَلْقِ مُنْفَرِدًا لِأَنَّ ذَلِكَ خِيمُ النِّكْسِ وَالْبَرَمِ"], ["إِنَّ الْغَدَا وَعَشَا الْهَادِي عَلَى ضَفَفٍ أَيْ كَثْرَةِ الْأَيْدِ لَمْ يُوصَفْ مِنَ السَّأَمِ"], ["وَالْكَفُّ مَا ضَرَبَتْ أُنْسًى وَلَا ذَكَرًا مَا خَادِمًا عَابَ مِنْ عَيْبٍ وَلَمْ يَلُمِ"], ["وَكُلُّ شَيْءٍ يَقُولُ اللَهُ فَاعِلُهُ لَوْلَمْ يَشَأْ ذَاكَ مَا قَدْ كَانَ مِنْ عَدَمِ"], ["مَا كَانَ مُنْتَقِمًا لِلنَّفْسِ مُحْتَجِبًا أَمَّا الطَّعَامُ فَلَمْ يُمْدَحْ وَلَمْ يَصِمِ"], ["وَطَاحِنٌ حَالِبٌ وَالشَّاةَ مُعْتَقِلٌ مُوَاكِلٌ خَاصِفٌ نَعْلًا مِنَ الْخَدَمِ"], ["قُلْ دَائِمُ الْبِشْرِ سَهْلُ الْخُلْقِ لَيْنُ جَنَا حٍ لَيْسَ فَظًّا غَلِيظَ الْقَلْبِ فِي الْأُمَمِ"], ["وَلَا صَخُوبٍ وَفَحَّاشٍ وَلَا مُتَفَحْحِشٍ وَلَيْسَ بِعَيَّابٍ كَذِي الْقَزَمِ"], ["لَيْسَ النَّبِيُّ بِمَزَّاحٍ وَقُلْ هُوَ فِي بَعْضِ الْأَحَايِينِ فِي تَأْنِيسِ جَمْعِهِمِ"], ["فِي نُسْخَةٍ لَيْسَ مَدَّاحًا وَلَيْسَ مُشَا حًا خَفِّفِ الْحَاءَ مِنْ وَزْنٍ فَلَمْ تُلَمِ"], ["قُلْ هَكَذَا سِيرَةُ الْمُخْتَارِ سَيِّدِنَا وَذَا حَدِيثٌ عَلِيٌّ عَنْ عَلِيِّهِمِ"], ["وَلَيْسَ خَيْرُ الْوَرَى يَجْزِي بِسَيِّئَةٍ يَعْفُو وَيَصْفَحُ صَفْحًا عَنْ مُسِيئِهِمِ"], ["جَمُّ الْحَيَاءِ فَمَا الْعَذْرَاءُ تُدْرِكُهُ فِي حِذْرِهَا وَأُمُورُ الْبَرِّ فِي الزَّمَمِ"], ["يَرُدُّ مَنْ أَمَّهُ مِنْ حَاجَةٍ بِلُهًى كَمَا اشْتَهَى أَوْ بِمَيْسُورٍ مِنَ الْكَلِمِ"], ["وَيَتْرُكُ النَّفْسَ مِنْ جِيمِ الْخِضَالِ مِرَا مَا لَيْسَ يَعْنِي وَإِكْثَارٍ مِنَ النِّعَمِ"], ["وَلَا يَذُمُّ عَرِيبًا لَا يُعَيِّبُهُ كَذَاكَ عَوْرَتَهُ الْمُخْتَارُ لَمْ يَرُمِ"], ["وَكُلُّ مَالَمْ يَكُنْ يَرْجُو الثَّوَابَ بِهِ يُولِيهِ صُمْتًا وَصَفْحًا أَيَّمَا شَمَمِ"], ["حَيْثُ انْتَهَى مَجْلِسٌ كَانَ الْجُلُوسُ لَهُ لَمْ يَجْلِسَنَّ بِغَيْرِ الذِّكْرِ لَمْ يَقُمِ"], ["وَكَانَ يَأْمُرُ هَذَا مَنْ يُجَالِسُهُ يَسِّرْ لَنَا إِسْوَةً يَا رَبِّ فِي الْإِمَمِ"], ["حِلْمٌ وَصَبْرٌ حَيَاءٌ وَالْأَمَانَةُ مَجْلِسُ الْكَرِيمِ وَرَفْعُ الصَّوْتِ فِيهِ حُمِي"], ["وَلَمْ يَقُومُوا لَهُ إِذْ جَاءَ عِلْمَهُمُ كَرَاهَةَ الْمُصْطَفَى التَّشْبِيهَ بِالْعَجَمِ"], ["وَمَنْ أَتَاهُ هَدَايَا قُلْ يُكَافِئُهُ فَكُنْ بِهِ آسِيًا فِي الْفِعْلِ وَالشِّيَمِ"], ["كَلَامُهُ فَبِذِكْرِ اللَهِ مُفْتَتِحٌ كَذَاكَ يَخْتِمُهُ يَا طِيبَ مُخْتَتَمِ"], ["إِذَا تَتَبَّعْتَ آيَاتِ النَّبِيِّ تَرَى بِأَنَّهُ فِي سِوَى الْخَيْرَاتِ لَمْ يُطَمِ"], ["أَعْدَدْتُ حُبَّ رَسُولِ اللَهِ مَحْشَرَتِي لِكَيْ يُلَاقِيَنِي فِي أَوَّلِ الظَّلَمِ"], ["كَمَا وَهَبْتَ لَنَا تَرْتِيبَ سِيرَتِهِ فَهَبْ لَنَا الاِقْتِدَا يَا هَادِيَ التَّهِمِ"], ["وَقَدْ تَوَسَّلْتُ يَا رَحْمَانُ يَا ثِقَتِي يَا مُغْنِيًا دَافِعَ الْأَوْزَارِ وَالنِّقَمِ"], ["رَبِّي بِأًسْمَائِكَ الْحُسْنَى وَأَعْظَمِهَا وَالَانْبِيَاءِ وَوُسْطَى سِلْكِ نَظْمِهِمِ"], ["مُحَمَّدٌ أَحْمَدُ الْمَاحِي وَحَاشِرُنَا نَبِيُّ مَرْحَمَةٍ تَوْبٍ وَمُلْتَحَمِ"], ["ثُمَّ الْمُقَفَّى بِشَدِّ الْفَاءِ قَدْ ضَبَطُوا وَكَسْرِهَا وَسُكُونِ الْيَا بِكُتْبِهِمِ"], ["وَالْعَاقِبُ الْمُقْتَفِي آثَارَ مَنْ سَبَقُوا مِنْ أَنْبِيَاءَ وَرُسْلِ اللَهِ كُلِّهِمِ"], ["زَادَ الْمَوَاهِبُ أَسْمَاءً وَرَتَّبَهَا عَلَى الْحُرُوفِ إِلَى الْيَا مُنْتَهَى الْكَلِمِ"], ["وَعَامَ أُهْدِئَ مُحْتَازًا عَلَى جَلَلٍ دَعَاهُ فِي صَفَرٍ مَوْلَاهُ لِلْكَرَمِ"], ["وَاخْتَارَ مَوْلَاهُ إِذْ مَا اللَهُ خَيَّرَهُ عَنِ الزَّخَارِفِ ذَا زُهْدٍ وَذَا شَمَمِ"], ["حَوَى يَدًا عِنْدَ بَعْضٍ فِي تَأَهُّبِهِ حَانَ الرَّحِيلُ لَهُ فِي يَوْمِهِ الْعَلَمِ"], ["فِي يَوْمِ مَوْلِدِهِ فِي بَيْتِ عَائِشَةٍ قَبْلَ الزَّوَالِ بِشَهْرِ الْمَوْلِدِ الْعَظِم"], ["لِلَيْلَةٍ قِيلَ أَوْ لَيْلَتَيْنِ قَدْ خَلَتَا وَقِيلَ فِي حُبِّهِ فَابْحَثْ وَلَا تَنَمِ"], ["يَوْمَ الثُّلَاثَاءِ قَدْ قِيلَ الْأُفُولُ لَهُ حِسًّا لَقَدْ طَابَ فِي بَدْءٍ وَمُخْتَتَمِ"], ["فِي الْقَوْلِ الَاشْهَرِ أَنَّ الدَّفْنَ لَيْلَةَ أَرْ بِعَاءَ فِي جَوْفِ لَيْلٍ فَادْرِ وَاحْتَكِمِ"], ["مِنْ دَهْشَةٍ أَخَّرُوا دَفْنَ النَّبِيِّ وَلِاشْتِغَالِهِمْ مَنْ يُوَلِّي كُلَّ أَمْرِهِمِ"], ["إِنَّ الصَّلَاةَ وَمَمْلُوكًا لَآخِرُ مَا أَوْصَى بِهِ الْمُصْطَفَى فِي حَالَةِ الْأَلَمِ"], ["جَلَالَ رَبٍّ رَفِيعٍ كَانَ آخِرُ مَا تَكَلَّمَ الْمُجْتَبَى مِنْ أَحْسَنِ الْكَلِمِ"], ["بَلْ قَالَ مَا قَالَ مِنْ عِنْدِ الْحَلِيمَةِ آ خِرَ الرَّضَاعِ الْبُخَارِي رَاعِ تَفْتَهِمِ"], ["وَكَانَ أُخْرِسَ عُثْمَانٌ وَأُخْبِلَ فَا رُوقٌ وَأُقْعِدَ لَيْثُ الْبُهْمِ وَالصِّمَمِ"], ["وَأُرْجِفَ النَّاسُ وَالْأَحْلَامُ ذَاهِلَةٌ لَوْلَا الْعَتِيقُ لَمَاتَ النَّاسُ بِالْغُمَمِ"], ["قَدْ كَانَ إِذْ ذَاكَ فِي سُنْحٍ وَعَالِيَةٍ وَجَاءَهُ النَّعْيُ ذَا حُزْنٍ وَذَا سَجَمِ"], ["جَثَا يُقَبِّلُهُ يَبْكِي يَقُولُ لَهُ قَدْ طِبْتَ يَا بَدْرُ فِي حَالَيْكَ وَا سَدَمِي"], ["إِنَّ الْجَمَادَاتِ كَادَتْ مِنْهُ صَادِعَةً فَكَيْفَ مَنْ آمَنُوا بِا اللَهِ رَبِّهِمِ"], ["إِنَّ الْجِنَانَ عَلَى التَّزْيِينِ يَوْمَ قُدُو مِ رُوحِهِ تَارِكَ الدُّنْيَا عَلَى الظُّلَمِ"], ["وَبَعْدَ مَا بَايَعُوا الصِّدِّيقَ قَدْ عَزَمُوا عَلَى جَهَازِ رَسُولٍ مُهْتَدٍ رَحِمِ"], ["فِي الْغُسْلِ وَالدَّفْنِ كَانَ الْخُلْفُ يَا لَهُمُ عَلَى فِرَاقِ حَبِيبٍ فَارِجِ الْهِمَمِ"], ["وَحَيْدَرٌ غُسْلُهُ وَالٍ يُقَلِّبُهُ الْعَبَّاسُ وَابْنَاهُ فَضْلٌ ثَنِّ بِالْقُثَمِ"], ["يَصُبُّ مَاءً عَلَى الْهَادِي أُسَامَةُ مَعْ شَقْرَانَ وَالْأَوْسُ مَعْدُودٌ بِجَمْعِهِمِ"], ["قَرَاحٌ السِّدْرُ كَافُورٌ بِهَا غَسَلُوا وَالْمَاءُ مِنْ بِئْرِ غَرْسٍ أَطْيَبِ السَّنِمِ"], ["وَكَفَّنُوهُ بِبِيضٍ قُلْ يَمَانِيَةٍ وَانْفِ الْعَمَامَةَ وَالتَّقْمِيصَ فِي الْغُمَمِ"], ["وَكَانَ يُدْرَجُ فِي الْأَكْفَانِ ثُمَّ هُمُ صَلَّوْا عَلَى الْبَدْرِ أَفْذَاذًا بِلَا أُمَمِ"], ["فِي الْقَبْرِ أَنْزَلَهُ الْغُسَّالُ أَوْسُهُمُ وَأَطْبَقُوا اللَّبِنَاتِ التِّسْعَ فِي الرَّجَمِ"], ["وَفِيهِ أَفْرَشَ حَمْرَاءَ الْقَطِيفَةِ شُقْرَانٌ وَمَا وَافَقَ الشُّقْرَانُ مِنْ أَرِمِ"], ["وَقِيلَ قَدْ أَخْرَجُوهَا بَعْدُ أُلْحِدَ قَبْرُ الْمُصْطَفَى خَيْرَ إِلْحَادٍ مِنَ الْخِدَمِ"], ["وَابْنُ الْحَمَامَةِ رَشَّ الْقَبْرَ يَبْدَأُ مِنْ وِجَاهَةِ الرَّأْسِ ثُمَّ الْقَلْبُ ذُو الضَّرَمِ"], ["يَا قَاضِيًا بِأُفُولِ الْبَدْرِ مُنْتَهِيًا عَلَيْهِ صَلِّ وَهَبْ لِي خَيْرَ مُخْتَتَمِ"], ["يَا مَنْ أَتَمَّ خِلَاصِي فَائِقًا ضُرَرًا قَدْ زَيَّنَتْ سِيرَةً مِنْ خِيرَةِ النُّظُمِ"], ["أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ جَرَائِمَنَا تَقْضِي حَوَائِجَنَا يَا وَاسِعَ الرُّحُمِ"], ["حَمْدًا يُوَافِي بِأَنْعَامٍ لَنَا وَفُرَتْ لِرَبِّنَا وَيُكَافِي الزَّيْدَ مِنْ نِعَمِ"], ["وَسَيِّئَ الْجَلْبِ قَدْ جِئْنَا وَلَيْسَ لَنَا مِنَ التَّسَوُّقِ بُدٌّ وَاسِعَ الْكَرَمِ"], ["وَذَاكُمُ جَمْرَةٌ فِي الْقَلْبِ مُحْرِقَةٌ لَكِنَّ \"لَا تَقْنَطُوا\" تُطْفِي مِنَ الْحَدَمِ"], ["فَأَعْطِنَا فِي اللِّقَا مَا اعْتِيدَ مِنْكَ مِنَ الْغُفْرَانِ وَالْعَفْوِ وَالْإِعْضَاءِ عَنْ جُرَمِ"], ["أَزْكَى صَلَاةٍ وَأَعْلَاهَا وَأَفْوَحُهَا عَلَى الْمُطَيَّبِ فِي حَالَيْهِ مُعْتَصَمِ"], ["أَزْكَى صَلَاةٍ وَتَسْلِيمٍ زَرَى عِطَرًا عَلَى الْحَبِيبِ الصَّفِيِّ الطَّاهِرِ الْمِعَمِ"], ["مَا حَنَّ حِبٌّ إِلَى لُقْيَا الْحَبِيبِ وَمَا يَقْفُو عَلَى سِيرَةِ الْمَحْبُوبِ وَالْقَدَمِ"], ["وَالآلِ وَالصَّحْبِ أَصْحَابِ الْهُدَى الْعُلَمَا قُبُورِ أَسْرَارِهِ لِلْأُمَّةِ النُّجُمِ"], ["رَبِّي بِهِ وَبِهِمْ أَبْغِي السُّلُوكَ إِلَى طَرِيقَةِ الرُّشْدِ وَالْخَيْرَاتِ وَالْعِصَمِ"], ["وَاصْبُبْ عَلَيْنَا بُحُورَ الْخَيْرِ وَالْكَرَمِ الْعَمِيمِ شِيعَتَنَا يَا مَلْجَأَ الزَّئِمِ"], ["وَلَيْسَ لِي أَمَلٌ أَلْقَاكَ يَا أَمَلِي سِوَى الْمَحَبَّةِ وَالتَّعْظِيمِ وَالسَّلَمِ"], ["أَسْبِلْ عَلَيَّ رِدَاءَ السِّتْرِ يَشْمُلُنِي وَوَالِدَيَّ وَأَشْيَاخِي مَعَ الْحَشَمِ"], ["أَرْجُوكَ يَا رَبَّنَا فِي كَوْنِ خِدْمَتِنَا بِضَاعَةً غَيْرَ مُزْجَاةٍ لَدَى السَّلَمِ"], ["وَبِعْتُ يَا رَبَّنَا بَيْعَ الْفُضُولِ فَكُنْ مُجِيزَهُ رَبَّنَا بِالْجُودِ وَالْكَرَمِ"], ["يَارَبِّ صَلِّ عَلَى الْمَحْوُدِ سَيِّدِنَا وَاقْبَلْ شَفَاعَتَهُ فِينَا وَلَمْ نُضَمِ"]]},
 {"id": "rz1", "cat": "malick", "lang": "ar", "title": "Riyy az-Zam'ân (Nûniyya)", "ar": "رِيُّ الظَّمْآنِ فِي مَوْلِدِ سَيِّدِ بَنِي عَدْنَانَ", "au": "الحاج مالك سي · El Hadji Malick Sy", "bsm": "بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ", "salat": "صلى الله على سيدنا محمد وعلى آله وسلم", "intro": "رِيُّ الظَّمْآنِ فِي مَوْلِدِ سَيِّدِ بَنِي عَدْنَانَ: القصيدة النونية في المولد النبوي الشريف، للشيخ الحاج مالك سي رضي الله عنه، في مائة وواحد وعشرين بيتا.", "introFr": "Riyy az-Zam'ân fî Mawlid Sayyid Banî ʿAdnân (« Ce qui désaltère l’assoiffé, sur la naissance du maître des fils de ʿAdnân ») : la Nûniyya de Seydi El Hadji Malick Sy sur la naissance du Prophète ﷺ, en 121 vers. La prononciation en lettres latines est écrite sous chaque vers.", "introEn": "Riyy az-Zam'ân fî Mawlid Sayyid Banî ʿAdnân (“Quenching the thirsty, on the birth of the master of the sons of ʿAdnân”): the Nûniyya of Seydi El Hadji Malick Sy on the birth of the Prophet ﷺ, in 121 verses. The pronunciation in Latin letters is written under each verse.", "notes": {}, "end": "صلى الله عليه وسلم", "bayts": [["أَلَا يَا دَعْدُ وَيْحَكِ نَبِّئِينِي", "بِذِكْرِ الْبَانِ تَهْتَانَ الْعُيُونِ"], ["أَفِي بَيْنٍ حِبَالُكِ أَمْ بِبَيْنٍ", "لِعُشَّاقٍ بِرَامَةَ خَبِّرِينِي"], ["فَفِي نَبْكِ الْأَحِبَّةَ كَيْ نُدَاوِي", "ضَنًى فِينَا بِإِجْرَاءِ الشُّؤُونِ"], ["إِلَامَا تَأْتَلِينَ بِكَيِّ قَلْبِي", "بِنَارِ الْحُبِّ كَيًّا غَيْرَ هُونِ"], ["تُعِيرِينَ الْهَوَى فِي كُلِّ يَوْمٍ", "مُدًى تَفْرِي الْفُؤَادَ مَعَ الْوَتِينِ"], ["دَعِي عَنْكِ التَّغَنُّجَ ذَاتَ دَلٍّ", "بِهِ يَزْدَادُ قَلْبِي مِنْ فُتُونِ"], ["أَلَا حَبْلَ الْمَوَدَّةِ جَدِّدِيهَا", "فَفِي التَّجْدِيدِ نَحْيَا كُلَّ حِينِ"], ["وَنَاجِينِي بِسِرٍّ غَيْرِ فَاشٍ", "وَكُونِي بِالْمَعَاهِدِ ذَكِّرِينِي"], ["مَنَازِلَ قَدْ عُهِدْتُ بِهَا بِسَلْعٍ", "وَكَاظِمَةٍ جِنَانًا لِلْقَطِينِ"], ["عُهِدْتُ بِهَا وَكُنْتُ رَخِيَّ بَالٍ", "أُحَادِثُ مِنْ حَدِيثٍ ذِي شُجُونِ"], ["نُدَامَانَا بُدُورٌ نَيِّرَاتٌ", "يُقِرُّ الْعَيْنَ خِدْنٌ مِنْ تَنِينِ"], ["وَصَرْعَى صَرْخَدٍ  return fetch('api/audio?a='+a,{method:'POST',headers:h,body:JSON.stringify(body||{}),cache:'no-store'}).then(function(r){return r.text().then(function(x){var j=null;try{j=x?JSON.parse(x):null}catch(e){}if(!r.ok){var er=new Error((j&&j.error)||('HTTP '+r.status));er.code=(j&&j.error)||String(r.status);throw er}return j})})}
function refreshAudBar(){if(view==='reader'&&cur&&!(curAud&&!curAud.paused))audioBar(cur)}
function audioBar(b){
 stopAudio();var ov=AUD[b.id],src=ov?'api/audio?a=get&id='+encodeURIComponent(ov.id):b.audio;
 if(!b.aud&&!src&&!AUTH.admin)return;
 var wrap=document.createElement('div');wrap.id='aud';
 var d=document.createElement('div');d.className='aud';wrap.appendChild(d);
 var pb=document.createElement('button');pb.textContent='▶';pb.setAttribute('aria-label',T('Lecture','Play','تشغيل'));
 var m=document.createElement('div');m.className='am';
 var tt=document.createElement('div');tt.className='at';
 var rg=document.createElement('input');rg.type='range';rg.min=0;rg.max=1000;rg.value=0;rg.setAttribute('aria-label',T('Position','Position','الموضع'));
 m.appendChild(tt);m.appendChild(rg);
 var tm=document.createElement('div');tm.className='tm';tm.textContent='0:00';
 var lp=document.createElement('button');lp.className='lp';lp.textContent='🔁';lp.setAttribute('aria-label',T('Répéter','Repeat','تكرار'));
 d.appendChild(pb);d.appendChild(m);d.appendChild(tm);d.appendChild(lp);
 $('rText').parentNode.insertBefore(wrap,$('rText'));
 if(AUTH.admin)audAdmin(b,wrap,!!ov);
 if(!src){tt.textContent=AUTH.admin&&!b.aud?T('Pas encore d’audio pour ce texte','No audio for this text yet','لا يوجد صوت بعد'):T('Audio bientôt disponible','Audio coming soon','الصوت قريبًا');pb.disabled=true;lp.disabled=true;rg.disabled=true;return}
 tt.textContent=(ov&&ov.title)||b.audioTitle||T('Écouter','Listen','استمع');
 var a=new Audio(src);a.preload='metadata';curAud=a;
 pb.onclick=function(){if(a.paused){a.play().catch(function(){toast(T('Lecture impossible pour le moment.','Cannot play right now.','تعذّر التشغيل الآن.'))})}else a.pause()};
 a.onplay=function(){pb.textContent='⏸'};a.onpause=function(){pb.textContent='▶'};
 a.onended=function(){pb.textContent='▶';rg.value=0};
 a.ontimeupdate=function(){if(a.duration&&isFinite(a.duration))rg.value=Math.round(a.currentTime/a.duration*1000);tm.textContent=fmtT(a.currentTime)+(a.duration&&isFinite(a.duration)?' / '+fmtT(a.duration):'')};
 a.onloadedmetadata=function(){if(isFinite(a.duration))tm.textContent='0:00 / '+fmtT(a.duration)};
 rg.oninput=function(){if(a.duration&&isFinite(a.duration))a.currentTime=rg.value/1000*a.duration};
 lp.onclick=function(){a.loop=!a.loop;lp.classList.toggle('on',a.loop)};
}
// Outil de l'administrateur : enregistrer ou choisir un audio, l'envoyer par morceaux, le supprimer
function audAdmin(b,wrap,has){
 var bt=gel('button','btn wide audbtn','🎙️ '+(has?T('Remplacer l’audio','Replace the audio','استبدال الصوت'):T('Ajouter un audio à ce texte','Add audio to this text','أضف صوتا لهذا النص'))+' · '+T('administration','admin','الإدارة'));
 var box=gel('div','audm hide');wrap.appendChild(bt);wrap.appendChild(box);
 bt.onclick=function(){box.classList.toggle('hide');if(!box.childNodes.length)build()};
 function build(){
  box.appendChild(gel('b','','🎧 '+T('Audio de « ','Audio for “','صوت «')+nm(b)+T(' »','”','»')));
  var ti=gel('input');ti.placeholder=T('Titre (facultatif) : ex. Récité par …','Title (optional): e.g. Recited by …','العنوان (اختياري)');ti.value=(AUD[b.id]&&AUD[b.id].title)||'';ti.setAttribute('aria-label',ti.placeholder);ti.maxLength=120;box.appendChild(ti);
  var row=gel('div','bar');row.style.flexWrap='wrap';
  var rb=gel('button','btn fill','🎙️ '+T('Enregistrer avec le micro','Record with the microphone','سجّل بالميكروفون'));
  var fb=gel('button','btn','📁 '+T('Choisir un fichier audio','Choose an audio file','اختر ملفا صوتيا'));
  var fi=gel('input');fi.type='file';fi.accept='audio/*,.mp3,.m4a,.aac,.ogg,.opus,.wav,.amr,.3gp';fi.className='hide';
  row.appendChild(rb);row.appendChild(fb);box.appendChild(row);box.appendChild(fi);
  var st=gel('div','audst');box.appendChild(st);
  var pv=gel('div','');box.appendChild(pv);
  box.appendChild(gel('p','note',T('Fichiers acceptés : MP3, M4A, AAC, OGG, OPUS (vocal WhatsApp), WAV · 15 Mo maximum (environ 30 minutes enregistrées ici).','Accepted files: MP3, M4A, AAC, OGG, OPUS (WhatsApp voice), WAV · 15 MB max (about 30 minutes recorded here).','الملفات المقبولة: MP3 وM4A وAAC وOGG وOPUS وWAV · 15 ميغابايت كحد أقصى.')));
  if(AUD[b.id]){var del=gel('button','btn danger wide','🗑️ '+T('Supprimer l’audio de ce texte','Delete this text’s audio','حذف صوت هذا النص'));del.onclick=function(){if(!confirm(T('Supprimer cet audio ?','Delete this audio?','حذف هذا الصوت؟')))return;del.disabled=true;
   apiAu('del',{item:b.id}).then(function(){delete AUD[b.id];try{localStorage.setItem('defteram_aud',JSON.stringify(AUD))}catch(e){}toast(T('Audio supprimé','Audio deleted','تم حذف الصوت'));audioBar(b)},function(e){del.disabled=false;toast('Erreur : '+e.code)})};box.appendChild(del)}
  var blob=null,rec=null,tick=null,t0=0;
  function ready(bl,label){blob=bl;pv.innerHTML='';var au=document.createElement('audio');au.controls=true;au.src=URL.createObjectURL(bl);au.style.cssText='width:100%;margin:8px 0';pv.appendChild(au);
   pv.appendChild(gel('p','note',label+' · '+(bl.size/1048576).toFixed(1)+' Mo'));
   var sv=gel('button','btn fill wide','💾 '+T('Enregistrer cet audio sur le texte','Save this audio on the text','احفظ هذا الصوت'));sv.onclick=function(){upload(sv)};pv.appendChild(sv)}
  fb.onclick=function(){fi.click()};
  fi.onchange=function(){var f=fi.files&&fi.files[0];if(!f)return;if(f.size>15*1048576){st.textContent='⚠️ '+T('Fichier trop lourd (15 Mo maximum).','File too large (15 MB max).','الملف كبير جدا (15 ميغابايت كحد أقصى).');return}st.textContent='';ready(f,'📁 '+f.name)};
  rb.onclick=function(){
   if(rec){if(rec.state!=='inactive')rec.stop();return}
   if(!navigator.mediaDevices||!window.MediaRecorder){st.textContent=T('Ce navigateur ne permet pas d’enregistrer : choisis un fichier.','This browser cannot record: choose a file.','هذا المتصفح لا يدعم التسجيل: اختر ملفا.');return}
   navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}}).then(function(stream){
    var mt=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].filter(function(x){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x)})[0];
    try{rec=new MediaRecorder(stream,mt?{mimeType:mt,audioBitsPerSecond:64000}:{audioBitsPerSecond:64000})}catch(e){rec=new MediaRecorder(stream)}
    var ch=[];rec.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
    rec.onstop=function(){stream.getTracks().forEach(function(t){t.stop()});clearInterval(tick);var r=rec;rec=null;rb.textContent='🎙️ '+T('Enregistrer à nouveau','Record again','سجّل من جديد');rb.classList.remove('danger');
     var bl=new Blob(ch,{type:(r.mimeType||mt||'audio/webm').split(';')[0]});st.textContent='';if(bl.size)ready(bl,'🎙️ '+fmtT((Date.now()-t0)/1000))};
    rec.start(1000);t0=Date.now();rb.textContent='⏹ '+T('Arrêter l’enregistrement','Stop recording','إيقاف التسجيل');rb.classList.add('danger');pv.innerHTML='';
    tick=setInterval(function(){var s=(Date.now()-t0)/1000;st.textContent='🔴 '+T('Enregistrement… ','Recording… ','جارٍ التسجيل… ')+fmtT(s);if(s>=1800&&rec&&rec.state==='recording')rec.stop()},300);
   },function(){st.textContent=T('Autorise le micro dans ton navigateur.','Allow the microphone in your browser.','اسمح باستخدام الميكروفون.')})};
  function mimeOf(f){var t=(f.type||'').split(';')[0],n=(f.name||'').toLowerCase().split('.').pop();if(/^audio\//.test(t))return t;
   return {mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',opus:'audio/ogg',oga:'audio/ogg',wav:'audio/wav',amr:'audio/amr','3gp':'audio/3gpp',webm:'audio/webm'}[n]||'audio/mpeg'}
  function b64(buf){var s='',u=new Uint8Array(buf);for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
  function readPart(bl){return bl.arrayBuffer?bl.arrayBuffer():new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=no;r.readAsArrayBuffer(bl)})}
  function upload(sv){if(!blob)return;sv.disabled=true;rb.disabled=fb.disabled=true;var bar=gel('div','pb');var fill=gel('i');bar.appendChild(fill);pv.appendChild(bar);
   var fail=function(e){sv.disabled=false;rb.disabled=fb.disabled=false;st.textContent='⚠️ '+(e&&e.code==='not_admin'?T('Réservé à l’administrateur.','Admin only.','للإدارة فقط.'):e&&e.code==='too_large'?T('Fichier trop lourd (15 Mo maximum).','File too large (15 MB max).','الملف كبير جدا.'):T('Envoi interrompu. Vérifie ta connexion et réessaie.','Upload interrupted. Check your connection and try again.','انقطع الإرسال. أعد المحاولة.')+' ('+((e&&e.code)||'')+')')};
   apiAu('begin',{item:b.id,mime:mimeOf(blob),size:blob.size,title:ti.value}).then(function(j){var i=0;
    function next(){if(i>=j.n)return apiAu('finish',{id:j.id,item:b.id}).then(function(r){AUD[b.id]=r.audio;try{localStorage.setItem('defteram_aud',JSON.stringify(AUD))}catch(e){}toast(T('Audio enregistré ✓','Audio saved ✓','تم حفظ الصوت ✓'));audioBar(b)});
     var part=blob.slice(i*j.chunk,(i+1)*j.chunk);return readPart(part).then(function(buf){var tries=0;function send(){return apiAu('chunk',{id:j.id,i:i,data:b64(buf)}).catch(function(e){if(++tries<3)return new Promise(function(ok){setTimeout(ok,1500)}).then(send);throw e})}return send()}).then(function(){i++;fill.style.width=Math.round(i/j.n*100)+'%';st.textContent='⬆️ '+T('Envoi… ','Uploading… ','جارٍ الإرسال… ')+Math.round(i/j.n*100)+'%';return next()})}
    return next()}).catch(fail)}
 }}
